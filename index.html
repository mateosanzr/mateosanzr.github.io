:root{--papel:#efeee9;--tinta:#1a1a18;--gris:#8a8882;--linea:#d3d1c9;--rec:#c8372d;--serif:"EB Garamond","Times New Roman",Times,serif;--gap:14px;--c:calc((100vw - 32px + var(--gap))/12)}
